schema_version: 1

context:
  name: e3sm-unified
  version: "1.14.0rc5"
  build: 0
  mpi: ${{ mpi or "nompi" }}
  mpi_prefix: ${{ "nompi" if mpi in ["nompi", "hpc"] else "mpi_" + mpi }}
  build_prefix: ${{ mpi if mpi in ["nompi", "hpc"] else "mpi_" + mpi }}

package:
  name: ${{ name }}
  version: ${{ version }}

build:
  number: ${{ build }}
  skip:
    - win or match(python, "<3.12") or match(python, ">=3.15")

  # add build string so packages can depend on
  # mpi or nompi variants explicitly:
  # `e3sm-unified * mpi_mpich_*` for mpich
  # `e3sm-unified * mpi_*` for any mpi
  # `e3sm-unified * nompi_*` for no mpi
  string: ${{ build_prefix }}_py${{ python | version_to_buildstring }}h${{ hash }}_${{ build }}

requirements:
  host:
    - python
  run:
    ### main packages ###
    - python
    # r-base is only built with gsl 2.7 but nco 5.4.1 requires gsl 2.8
    # - r
    # cdo 2.6.1 is not available on osx and cdo 2.5.0 requires libnetcdf <4.10.1
    - if: linux
      then: cdo
    - chemdyg ==1.1.1
    - cprnc ==1.1.4
    - e3sm_diags ==3.3.0rc3
    - e3sm_to_cmip ==1.15.0rc1
    - e3sm-quickview ==2.10.5
    - e3sm_compareview ==1.11.3
    - geometric_features ==1.6.3
    - globus-cli >=3.15.0
    - ipython
    - jupyter
    - livvext ==1.1.2
    - livvkit ==3.3.1
    - mache ==5.2.0
    - mosaic ==1.3.1
    - mpas-analysis ==1.16.0rc1
    - mpas_tools ==2.1.0
    - pcmdi_metrics ==4.2.1
    # uxarray without geo and viz extras
    - uxarray-base >=2026.09.1
    - xcdat ==0.11.5
    - zppy ==3.3.0rc2
    - zppy-interfaces ==0.3.0rc1
    - if: mpi != "hpc"
      then:
        - moab ==5.6.0 ${{ mpi_prefix }}_tempest_*
        - nco ==5.4.1
        - tempest-remap ==2.2.0
        - tempest-extremes ==2.4.2 ${{ mpi_prefix }}_*
    - if: mpi != "nompi" and mpi != "hpc"
      then: ilamb ==2.7.2
    - if: linux
      then:
        - e3sm-tools ==3.1.0
        - squadgen ==1.2.2
        - zstash ==1.6.1rc1

    ### mkdocs
    - mkdocs-material
    - pymdown-extensions
    - mkdocs-monorepo-plugin
    - mdutils
    - mkdocs-bibtex ==2.18.0
    - mkdocs-redirects
    - markdownlint-cli2

    ### dependencies ###
    - if: mpi != "nompi" and mpi != "hpc"
      then: ${{ mpi }}
    - blas
    - bottleneck
    - cartopy ==0.26.0
    - cmocean
    - dask ==2026.8.0
    - dogpile.cache
    - eofs
    - esmf ==8.9.1 ${{ mpi_prefix }}_*
    - esmpy ==8.9.1
    - f90nml
    - ffmpeg
    - globus-sdk
    - gsw
    - hdf5 ==1.14.6 ${{ mpi_prefix }}_*
    - ipygany
    - libnetcdf ==4.10.1 ${{ mpi_prefix }}_*
    - lxml
    - matplotlib-base ==3.11.1
    - metpy
    - if: mpi != "nompi" and mpi != "hpc"
      then: mpi4py
    - ncview ==2.1.11
    - ncvis-climate ==2026.10.07
    - nc-time-axis
    - netcdf4 ==1.7.4 nompi_*
    - notebook
    - numpy >=2.0.0,<3.0.0
    - if: mpi == "openmpi"
      then: openssh
    - output_viewer ==1.3.3
    - pillow
    - plotly
    - progressbar2
    # TODO: proj 9.9.0 once cdo and rasterio have been rebuilt for it
    - proj ==9.8.1
    - pyevtk
    - pyproj ==3.8.0
    - pyremap
    - pytest
    - pytorch ==2.13.0
    - pywavelets
    # r-base is only built with gsl 2.7 but nco 5.4.1 requires gsl 2.8
    # - r-tidyverse
    # - r-dplyr ==1.2.0
    # - r-ggplot2
    - scikit-image
    - scipy >=0.9.0
    - shapely
    - sympy >=0.7.6
    - tabulate
    - windspharm
    - xarray ==2026.7.0
    - xesmf ==0.9.2
    - zarr >=3

    # additional ilamb 2.7.2 dependencies, for system MPI builds
    - if: mpi == "hpc"
      then:
        - cython
        - cf-units >=2.0.0
        - psutil
        - pandas

    # needed for e3sm-quickview and e3sm_compareview
    - if: linux
      then:
        - mesa-llvmpipe

tests:
  - python:
      imports:
        - chemdyg
        - e3sm_diags
        - e3sm_to_cmip
        - e3sm_quickview
        - if: not (linux and aarch64)
          then: e3sm_compareview
        - mpas_analysis
        - IPython
        - globus_cli
        - livvext
        - livvkit
        - mache
        - mosaic
        - uxarray
        - zppy
        - if: mpi != "nompi" and mpi != "hpc"
          then: ILAMB
        - if: linux
          then: zstash
      # nodejs (via livvkit) won't pass pip check
      pip_check: false

  - script:
      - mpas_analysis --version
      - lex-cfg --help
      - livv --version
      - e3sm_diags --help
      - quickview --help
      - quickcompare --help
      - jupyter --help
      - ipython -h
      - ipython3 -h
      - globus --help
      - zppy --help
      - if: linux
        then:
          - zstash --help
      - if: mpi != "nompi" and mpi != "hpc"
        then:
          - ilamb-fetch -h
          - ilamb-run -h
      - if: mpi != "hpc"
        then:
          - ncks --help
          - ncap2 --help
          - GenerateCSMesh --res 64 --alt --file gravitySam.000000.3d.cubedSphere.g
          - ESMF_RegridWeightGen --help
          - test -f ${PREFIX}/bin/Climatology

about:
  homepage: https://github.com/E3SM-Project/e3sm-unified
  summary: |
    A metapackage for a unified conda environment for analysis of results
    from the Energy Exascale Earth System Model (E3SM).
  license: BSD-3-Clause
  license_file: LICENSE
  repository: https://github.com/E3SM-Project/e3sm-unified
  documentation: https://github.com/E3SM-Project/e3sm-unified/blob/main/README.md


extra:
  recipe-maintainers:
    - andrewdnolan
    - xylar
